plugins { id 'com.android.application' }

android {
    namespace 'dev.chet.mobiletypeframe'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.chet.mobiletypeframe'
        minSdk 27
        targetSdk 28
        versionCode 3
        versionName '1.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
